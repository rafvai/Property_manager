name: Build PropertyManager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: PropertyManager-Windows
            exe_path: dist/PropertyManager
          - os: macos-latest
            artifact_name: PropertyManager-macOS
            exe_path: dist/PropertyManager

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Debug struttura progetto
        run: |
          python -c "import sys; print('\n'.join(sys.path))"
          python -c "import dialogs; print('dialogs OK')"
          python -c "import ui_main; print('ui_main OK')"
          python -c "import ui_login; print('ui_login OK')"
          python -c "import styles; print('styles OK')"

      - name: Build con PyInstaller
        run: pyinstaller --clean property_manager.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.exe_path }}
          retention-days: 30