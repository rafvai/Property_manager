name: Build PropertyManager

on:
  push:
    tags:
      - 'v*'          # Si attiva solo quando crei un tag tipo v1.0.0
  workflow_dispatch:  # Permette di avviare il build manualmente dal sito

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: PropertyManager-Windows
            exe_path: dist/PropertyManager
          - os: macos-latest
            artifact_name: PropertyManager-macOS
            exe_path: dist/PropertyManager

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6
          pip install sqlalchemy
          pip install alembic
          pip install reportlab
          pip install openpyxl
          pip install python-dotenv
          pip install cryptography
          pip install keyring
          pip install requests
          pip install matplotlib
          pip install numpy

      - name: Build con PyInstaller
        run: pyinstaller property_manager.spec --clean --paths=.   # <-- aggiunto --paths=.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.exe_path }}
          retention-days: 30